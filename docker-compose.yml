services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "${FALKORDB_HOST_PORT:-6379}:6379" # Redis protocol; set FALKORDB_HOST_PORT in .env if 6379 is taken
      - "3000:3000" # FalkorDB Browser
    volumes:
      - falkordb-data:/var/lib/falkordb/data

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Inside compose the backend talks to the falkordb service, whatever .env says for local runs.
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_USERNAME: ""
      FALKORDB_PASSWORD: ""
    ports:
      - "8000:8000"
    depends_on:
      - falkordb

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  falkordb-data:
