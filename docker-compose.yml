services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "${FALKORDB_HOST_PORT:-6379}:6379" # Redis protocol; set FALKORDB_HOST_PORT in .env if 6379 is taken
      - "3000:3000" # FalkorDB Browser
    volumes:
      - falkordb-data:/var/lib/falkordb/data

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    ports:
      - "8000:8000"
    depends_on:
      - falkordb

  # frontend: added once the Vite app exists in ./frontend

volumes:
  falkordb-data:
